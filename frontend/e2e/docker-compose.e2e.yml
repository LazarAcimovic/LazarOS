# Throwaway SQL Server for the Playwright e2e run. No volume: `down -v` leaves nothing behind.
# Host port 14334 keeps it isolated from the backend test DB (14333) and any local SQL Server.
services:
  lazaros-e2e-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lazaros-e2e-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LazarOS_E2E_Pass123!"
    ports:
      - "14334:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
